# nginx config for the frontend container. Sits in conf.d/ so it is merged into
# the unprivileged image's own nginx.conf rather than replacing it.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The whole UI is a single page, so every unmatched path has to resolve to
    # index.html or a refresh on /rides/anything 404s. Real asset requests are
    # unaffected: try_files prefers the file on disk when it exists.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The orchestrator, same-origin.
    #
    # The trailing slash on proxy_pass is load-bearing: it strips the /api
    # prefix, so the browser's /api/rides/request arrives upstream as
    # /rides/request, which is the path orchestrator/main.py actually declares.
    # Without it every request 404s inside the orchestrator, with a 200 from
    # nginx around it, which reads as a backend problem.
    location /api/ {
        proxy_pass http://orchestrator:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The UI polls GET /rides/{id} at 1 Hz and re-asks for a plan whenever
        # the rider switches pickup option, so these are long-lived by design.
        # The defaults (60s read, 60s keepalive) start closing idle upstream
        # connections mid-demo; without proxy_http_version 1.1 above they can
        # also be reused for a request nginx no longer considers current.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        # The app is driven by fetch(), so no buffering surprises: a response
        # must reach the browser as soon as the orchestrator produces it.
        proxy_buffering off;
    }

    # Leaflet pulls its basemap tiles from tile.openstreetmap.org directly from
    # the browser, so they never traverse this proxy. Noted because it is the
    # obvious next thing to "fix" and the fix would be wrong.

    # Hashed Vite assets (/assets/index-<hash>.js) are immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must not be cached, or a deploy leaves browsers holding a
    # document that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container is not a place to keep logs; docker logs is. Silences the
    # "no user directive specified" noise on every start.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/geo+json;
}
