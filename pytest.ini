[pytest]
testpaths = tests
# `-q` by default: the suite is fast (well under a second) and a scrolling wall
# of dots hides the one line that matters when something breaks.
addopts = -q --strict-markers
filterwarnings =
    # Starlette's TestClient warns about httpx on every import. Harmless, and not
    # actionable from here -- it is about starlette's own dependency, not ours.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
